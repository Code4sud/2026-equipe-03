# ==============================================================================
# MonBilan+ — Stack Complète Conteneurisée (Web + API + Worker + Postgres + Redis)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-monbilan_owner}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local_dev_owner_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-monbilan_plus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-rls-role.sql:/docker-entrypoint-initdb.d/01-init-rls-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-monbilan_owner} -d ${POSTGRES_DB:-monbilan_plus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monbilan_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - monbilan_net

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      PRIVATE_STORAGE_PATH: /var/lib/monbilan/storage
    volumes:
      - private_storage:/var/lib/monbilan/storage
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - monbilan_net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      PRIVATE_STORAGE_PATH: /var/lib/monbilan/storage
    volumes:
      - private_storage:/var/lib/monbilan/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monbilan_net

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:4200:8080"
    networks:
      - monbilan_net

volumes:
  postgres_data:
  redis_data:
  private_storage:

networks:
  monbilan_net:
    driver: bridge
